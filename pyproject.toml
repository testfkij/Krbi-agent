[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "krbi-agent"
version = "1.2.0"
description = "Provider-neutral AI workspace with CLI, TUI, browser UI, tools, and MCP"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "rich>=13",
  "textual>=0.50",
]

[project.scripts]
krbi = "krbi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
