name: Source Release Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: python -m pip install -e . pytest

      - name: Validate source
        run: |
          PYTHONPATH=src python -m compileall -q src tests
          PYTHONPATH=src pytest -q

      - name: Build commit-based source archive
        run: |
          VERSION=$(grep '^VERSION=' update.txt | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          mkdir -p dist
          git archive --format=zip --output="dist/krbi-agent-$VERSION-$SHORT_SHA.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: krbi-agent-source
          path: dist/*.zip
          retention-days: 30
