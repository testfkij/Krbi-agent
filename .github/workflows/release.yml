name: Source Release Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e .

      - name: Validate source
        run: |
          PYTHONPATH=src python -m compileall -q src tests
          PYTHONPATH=src pytest -q tests/test_agent.py tests/test_updater.py tests/test_queue.py tests/test_versions.py tests/test_mcp.py tests/test_mcp_http.py tests/test_tunnel.py tests/test_provider_discovery.py tests/test_settings.py tests/test_tools.py tests/test_web_ui.py

      - name: Build commit-based source archive
        run: |
          VERSION=$(grep '^VERSION=' update.txt | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          mkdir -p dist
          git archive --format=zip --output="dist/krbi-agent-$VERSION-$SHORT_SHA.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: krbi-agent-source
          path: dist/*.zip
          retention-days: 30
